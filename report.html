<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Weekly Hours</title>
<style>
  :root {
    --bg: #f6f6f8; --card: #fff; --line: #e7e7ec; --text: #15151a; --muted: #6e6e7a; --accent: #4f46e5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0c10; --card: #17171d; --line: #2a2a33; --text: #f4f4f6; --muted: #8d8d99; --accent: #a5b4fc; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    padding: calc(env(safe-area-inset-top) + 24px) 16px 32px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 6px 0 2px; font-size: 28px; }
  .range { color: var(--muted); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 22px 0; }
  .stat { background: var(--card); border-radius: 18px; padding: 16px; }
  .stat .v { font-size: 34px; font-weight: 300; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 13px; color: var(--muted); font-weight: 600; }
  .stat.hl .v { color: var(--accent); }
  .card { background: var(--card); border-radius: 18px; padding: 8px 16px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; text-align: right; padding: 12px 0 8px 10px; }
  td { text-align: right; padding: 10px 0 10px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  .m { color: var(--muted); }
  .span { color: var(--muted); font-size: 13px; margin-top: 2px; }
  td { vertical-align: top; }
  tr.zero td { color: var(--muted); }
  tfoot td { font-weight: 700; }
  .err { text-align: center; color: var(--muted); margin-top: 30vh; }
  h1 { -webkit-user-select: none; user-select: none; cursor: default; }
  .stamp {
    margin: 22px auto 0; width: max-content; padding: 10px 18px; border: 3px solid #16a34a; color: #16a34a;
    border-radius: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 15px;
    transform: rotate(-6deg) scale(2); opacity: 0; transition: .35s cubic-bezier(.2,1.4,.4,1); pointer-events: none;
  }
  .stamp.show { opacity: 1; transform: rotate(-6deg) scale(1); }
  footer { margin-top: 18px; text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(() => {
  const app = document.getElementById('app');
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const h = m => (Math.max(0, m) / 60).toFixed(2);
  let data;
  try {
    const b64 = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    data = JSON.parse(decodeURIComponent(escape(atob(b64))));
  } catch {
    app.innerHTML = '<p class="err">This link doesn\'t contain a timesheet.</p>';
    return;
  }
  const [y, mo, d] = data.s.split('-').map(Number);
  const start = new Date(y, mo - 1, d);
  const day = i => { const x = new Date(start); x.setDate(x.getDate() + i); return x; };
  const short = x => x.toLocaleDateString([], { month: 'short', day: 'numeric' });
  let total = 0, brk = 0;
  const rows = data.d.map(([inT, outT, t, b], i) => {
    total += t; brk += b;
    const dt = day(i);
    return `<tr class="${t ? '' : 'zero'}">
      <td>${DAYS[dt.getDay()]} <span class="m">${short(dt)}</span>
        ${inT ? `<div class="span">${esc(inT)} – ${esc(outT) || 'now'}</div>` : ''}</td>
      <td>${h(b)}</td><td>${h(t)}</td><td>${h(t - b)}</td></tr>`;
  }).join('');
  const end = day(6);
  document.title = `Hours · ${short(start)} – ${short(end)}`;
  app.innerHTML = `
    <div class="eyebrow">Weekly timesheet</div>
    <h1>${esc(data.n) || 'Weekly hours'}</h1>
    <div class="range">${short(start)} – ${short(end)}, ${end.getFullYear()}</div>
    <div class="stats">
      <div class="stat"><div class="v">${h(total)}</div><div class="k">Total hours</div></div>
      <div class="stat hl"><div class="v">${h(total - brk)}</div><div class="k">Adjusted for breaks</div></div>
    </div>
    <div class="card"><table>
      <thead><tr><th>Day</th><th>Break</th><th>Total</th><th>Adjusted</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>Week</td><td>${h(brk)}</td><td>${h(total)}</td><td>${h(total - brk)}</td></tr></tfoot>
    </table></div>
    <footer>Hours shown in decimal (7.50 = 7h 30m)</footer>
    <div class="stamp" id="stamp">Approved by Keith ✅</div>`;

  // Tap the name 5 times to approve
  let taps = 0, timer;
  document.querySelector('h1').onclick = () => {
    clearTimeout(timer); timer = setTimeout(() => taps = 0, 1500);
    if (++taps < 5) return;
    taps = 0;
    document.getElementById('stamp').classList.add('show');
    const colors = ['#34d399', '#fbbf24', '#fb7185', '#6366f1'];
    for (let i = 0; i < 80; i++) {
      const p = document.createElement('span');
      p.style.cssText = `position:fixed;top:-12px;left:${Math.random() * 100}vw;width:9px;height:5px;background:${colors[i % 4]};border-radius:2px;pointer-events:none`;
      document.body.appendChild(p);
      p.animate([{ transform: 'none' }, { transform: `translate(${(Math.random() - .5) * 200}px,${innerHeight + 40}px) rotate(${Math.random() * 720}deg)` }],
        { duration: 1800 + Math.random() * 1400, easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = () => p.remove();
    }
  };
})();
</script>
</body>
</html>
